name: Erreur dans le contenu
description: Une information fausse, dépassée ou peu claire sur le site ou dans la documentation.
labels: [type:docs, area:docs]
body:
  - type: markdown
    attributes:
      value: |
        Le site suit l'API : chaque information doit être confirmée par le dépôt [`arnakoff/api`](https://github.com/arnakoff/api).
        Si l'API elle-même se trompe, ouvre plutôt une issue [dans son dépôt](https://github.com/arnakoff/api/issues/new/choose).
  - type: input
    id: url
    attributes:
      label: Page
      description: L'adresse de la page concernée.
      placeholder: https://arnakoff.com/docs/
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Passage concerné
      description: Copie le texte tel qu'il apparaît.
      render: text
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction proposée
      description: Ce qui devrait être écrit, et pourquoi.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Le fichier de `arnakoff/api` ou la source officielle qui appuie la correction.
