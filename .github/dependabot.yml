version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @astrojs/check 0.9.12 accepts typescript ^5 || ^6 only (checked on
      # 2026-10-29). Lift this once its peer range includes 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
